.lbl{font-weight:800;paint-order:stroke;stroke:#000;stroke-width:4px;fill:var(--ok);pointer-events:none;text-anchor:middle}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;padding:12px 14px 0}
.opts button{background:var(--sea);color:var(--txt);font-size:18px}
.opts button.ok{background:var(--ok);color:#000}.opts button.bad{background:var(--bad);color:#fff}
.msg{padding:12px 16px;font-size:17px;min-height:50px;font-weight:600}
.msg.ok{color:#1c7c3d}.msg.bad{color:#c4282d}
.end,.menu{padding:24px 16px;text-align:center}
.end h2{margin:0 0 8px;font-size:44px}.menu h1{margin:0 0 4px;font-size:26px}

button{font:inherit;font-weight:700;background:var(--bar);color:#fff;border:0;border-radius:10px;padding:10px 20px;cursor:pointer;margin:4px}

  m.textContent=q.t==='click'?"Juist! Dat is "+want+".":"Juist! De hoofdstad van "+q.id+" is "+want+".";m.className="msg ok";next();
 }else{
  tries++;node.classList.add("bad");setTimeout(()=>node.classList.remove("bad"),700);
  if(tries>=2){
   done++;let c;
   if(q.t==='click')c=document.querySelector('[data-n="'+want+'"]');else c=[...document.querySelectorAll("#opts button")].find(b=>b.textContent===want);
   c.classList.add("ok","done");label(q,c);
   m.textContent=q.t==='click'?"Dat was "+n+". Hier is "+want+".":"Het juiste antwoord is "+want+".";m.className="msg bad";next();
  }else{m.textContent=q.t==='click'?"Dat is "+n+". Probeer nog eens naar "+want+".":"Dat is niet juist. Probeer nog eens.";m.className="msg bad"}
 }
}
function next(){busy=true;setTimeout(()=>{busy=false;i++;if(i>=Q.length)finish();else{show();$("msg").textContent="";$("msg").className="msg"}},1400)}
function finish(){
 clearInterval(tick);const P=Math.round(100*right/Q.length);
 $("count").textContent=Q.length+" / "+Q.length+" · "+right+" juist · "+P+"%";
 $("score").textContent=P+"% score";
 $("detail").textContent=right+" van "+Q.length+" meteen juist. "+(right===Q.length?"Perfect!":P>=60?"Goed bezig, nog even oefenen.":"Oefen nog eens, dan lukt het volgende keer beter.");
 $("end").classList.remove("hide");$("msg").textContent="";$("opts").classList.add("hide");
}
function start(k){
 mode=k;let q=shuf(MODES[k][2]());if(k==='mix')q=q.slice(0,15);
 Q=q;i=0;right=0;done=0;busy=false;
 $("menu").classList.add("hide");$("quiz").classList.remove("hide");$("end").classList.add("hide");$("msg").textContent="";$("msg").className="msg";
 clearInterval(tick);t0=Date.now();
 tick=setInterval(()=>{const s=Math.floor((Date.now()-t0)/1000);$("timer").textContent=String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0")},500);
 show();
}
function menu(){clearInterval(tick);busy=false;$("quiz").classList.add("hide");$("menu").classList.remove("hide")}
for(const k in MODES){const b=document.createElement("button");b.innerHTML=MODES[k][0]+"<small>"+MODES[k][1]+"</small>";b.onclick=()=>start(k);$("list").appendChild(b)}
$("again").onclick=()=>start(mode);$("menu2").onclick=menu;$("back").onclick=menu;
</script></body></html>
